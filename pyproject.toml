[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-coupling"
version = "0.1.0"
description = "Controlled multi-question experiments for masked diffusion language models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.5,<3", "transformers>=4.46.2,<5", "accelerate>=0.34,<2", "safetensors>=0.4"]

[project.scripts]
dlm-coupling = "dlm_coupling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

